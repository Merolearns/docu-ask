{% extends "base.html" %}
{% block content %}
<h1>Documents</h1>
{% if docs %}
<table>
  <tr><th>File</th><th>Words</th></tr>
  {% for d in docs %}
  <tr><td>{{ d.name }}</td><td>{{ d.words }}</td></tr>
  {% endfor %}
</table>
{% else %}
<p class="hint">No documents indexed yet. <a href="{{ url_for('upload') }}">Upload one</a> to get started.</p>
{% endif %}
{% endblock %}
